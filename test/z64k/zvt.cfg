# Linker-Konfiguration fuer zvt.s: PRG-Datei ab $2F00 (mit Ladeadresse), Variablen und Ergebnispuffer im BSS
MEMORY {
    HDR:  start = $2EFE, size = 2,     type = ro, file = %O;
    PRG:  start = $2F00, size = $0800, type = ro, file = %O, fill = yes;
    VARS: start = $3800, size = $0100, type = rw;
}
SEGMENTS {
    LOADADDR: load = HDR,  type = ro;
    CODE:     load = PRG,  type = ro;
    TABLES:   load = PRG,  type = ro, align = $100;
    VARS:     load = VARS, type = bss;
}
