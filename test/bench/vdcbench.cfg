# ld65-Konfiguration fuer vdcbench.s: PRG mit Ladeadresse $2000, BSS getrennt bei $3000
MEMORY {
    LOADADDR: file = "%O", start = $0000, size = 2;
    MAIN:     file = "%O", start = $2000, size = $1000;
    BSSMEM:   file = "",   start = $3000, size = $0800;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = BSSMEM,   type = bss;
}
