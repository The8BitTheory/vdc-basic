MEMORY {
    HDR:  start = $12FE, size = 2,     file = %O;
    MAIN: start = $1300, size = $0700, file = %O, fill = yes;
    WRK:  start = $1A00, size = $0100, file = %O;
}
SEGMENTS {
    LOADADDR: load = HDR,  type = ro;
    CODE:     load = MAIN, type = rw;
    WORK:     load = WRK,  type = rw;
}
