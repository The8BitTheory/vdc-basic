MEMORY {
    HDR:  start = $1BFF, size = 2,     file = %O;
    MAIN: start = $1C01, size = $23FF, file = %O;
}
SEGMENTS {
    LOADADDR: load = HDR,  type = ro;
    CODE:     load = MAIN, type = rw;
    FV:       load = MAIN, type = rw, align = $100;
    BSS:      load = MAIN, type = bss, define = yes;
}
