MEMORY {
    HDR:  start = $12FE, size = 2,     file = %O;
    MAIN: start = $1300, size = $08FE, file = %O;
    WRK:  start = $0E00, size = $0200, file = "";
}
SEGMENTS {
    LOADADDR: load = HDR,  type = ro;
    CODE:     load = MAIN, type = rw;
    WORK:     load = WRK,  type = bss, define = yes;
}
